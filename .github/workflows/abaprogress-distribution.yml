name: ABAProgress signed distribution export
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 25
    environment: app-store
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
      APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 ABAProgress/QA/select_xcode.py
      - name: Validate private signing configuration
        run: |
          python3 - <<'PY'
          import os,re
          required=['APPLE_TEAM_ID','APPLE_DISTRIBUTION_P12_BASE64','APPLE_DISTRIBUTION_P12_PASSWORD','APPLE_PROFILE_BASE64']
          missing=[key for key in required if not os.environ.get(key)]
          if missing: raise SystemExit('Missing signing secrets: '+', '.join(missing))
          if not re.fullmatch('[A-Z0-9]{10}',os.environ['APPLE_TEAM_ID']): raise SystemExit('Invalid Team ID format')
          PY
      - name: Import signing assets and export IPA
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/aba-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          export ABA_SIGNING_DIR="$RUNNER_TEMP/aba-signing"
          mkdir -p "$ABA_SIGNING_DIR"
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          root=Path(os.environ['ABA_SIGNING_DIR'])
          for key,name in [('APPLE_DISTRIBUTION_P12_BASE64','distribution.p12'),('APPLE_PROFILE_BASE64','distribution.mobileprovision')]:
              p=root/name;p.write_bytes(base64.b64decode(os.environ[key],validate=True));p.chmod(0o600)
          PY
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$ABA_SIGNING_DIR/distribution.p12" -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$ABA_SIGNING_DIR/distribution.mobileprovision" > "$ABA_SIGNING_DIR/profile.plist"
          python3 - <<'PY'
          import os,plistlib,datetime,shutil
          from pathlib import Path
          root=Path(os.environ['ABA_SIGNING_DIR']);p=plistlib.loads((root/'profile.plist').read_bytes())
          team=os.environ['APPLE_TEAM_ID'];bundle='com.abaprogress.universal'
          assert team in p['TeamIdentifier'],'Profile belongs to another team'
          assert p['Entitlements']['application-identifier'].endswith('.'+bundle),'Profile Bundle ID mismatch'
          assert p['ExpirationDate']>datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None),'Expired profile'
          assert not p.get('ProvisionedDevices') and not p.get('ProvisionsAllDevices'),'An App Store profile is required'
          assert not p['Entitlements'].get('get-task-allow',False),'Development profile is not allowed'
          profiles=Path.home()/'Library/MobileDevice/Provisioning Profiles';profiles.mkdir(parents=True,exist_ok=True)
          shutil.copy2(root/'distribution.mobileprovision',profiles/(p['UUID']+'.mobileprovision'))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('ABA_PROFILE_UUID='+p['UUID']+'\n')
          (root/'profile-uuid.txt').write_text(p['UUID'])
          (root/'ExportOptions.plist').write_bytes(plistlib.dumps({'method':'app-store-connect','teamID':team,'signingStyle':'manual','destination':'export','provisioningProfiles':{bundle:p['UUID']},'uploadSymbols':True}))
          PY
          ABA_PROFILE_UUID="$(cat "$ABA_SIGNING_DIR/profile-uuid.txt")"
          xcodebuild -project ABAProgress/XcodeProject/ABAProgress.xcodeproj -scheme ABAProgress \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ABAProgress.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$ABA_PROFILE_UUID" archive
          python3 ABAProgress/QA/verify_archive.py "$RUNNER_TEMP/ABAProgress.xcarchive"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ABAProgress.xcarchive" \
            -exportPath "$RUNNER_TEMP/aba-distribution" -exportOptionsPlist "$ABA_SIGNING_DIR/ExportOptions.plist"
      - name: Remove signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/aba-signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/aba-signing"
          if [ -n "${ABA_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$ABA_PROFILE_UUID.mobileprovision"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ABAProgress-signed-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/aba-distribution/*.ipa
          if-no-files-found: error
          retention-days: 3
