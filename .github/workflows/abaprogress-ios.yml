name: ABAProgress iOS validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ABAProgress/**'
      - '.github/workflows/abaprogress-ios.yml'

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build, run scenarios, and launch on iPhone and iPad
        run: python3 ABAProgress/QA/validate_macos.py
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ABAProgress-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation-results/*.txt
            validation-results/*.json
            validation-results/*.png
            validation-results/*.xcresult/**
          if-no-files-found: error
