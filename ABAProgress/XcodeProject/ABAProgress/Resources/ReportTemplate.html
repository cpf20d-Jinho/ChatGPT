<!doctype html><html lang="ko"><meta charset="utf-8">
<style>

:root{color-scheme:light}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;color:#202020;background:#fff;font:10pt -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.65}
header{border-bottom:1pt solid #222;padding-bottom:8pt}.logo{width:36pt;height:36pt;object-fit:contain;vertical-align:middle;margin-right:8pt}
h1{font-size:24pt;letter-spacing:2pt;margin:8pt 0 12pt}h2{font-size:12pt;margin:16pt 0 7pt;break-after:avoid;page-break-after:avoid}h3{font-size:10pt;margin:0 0 5pt;break-after:avoid;page-break-after:avoid}
p{margin:5pt 0;white-space:pre-wrap;overflow-wrap:anywhere}.hint{font-size:8pt;color:#666}.performance-record{margin:12pt 0 18pt}.program-title{font-weight:600}
table{width:100%;border-collapse:collapse;table-layout:fixed}td,th{border:.7pt solid #555;padding:5pt 8pt;vertical-align:top;overflow-wrap:anywhere}th{width:22%;font-weight:600;background:#fafafa}
ul{padding-left:16pt;margin:2pt 0 5pt}.task-level{margin-bottom:4pt}.chart{width:100%;display:block}.graph-box{border:.7pt solid #555;border-top:0;padding:8pt;break-inside:avoid;page-break-inside:avoid}
.narrative-block{margin:7pt 0}.body{border:.7pt solid #777;padding:7pt 9pt;white-space:pre-wrap;overflow-wrap:anywhere;orphans:3;widows:3;min-height:30pt}
@media screen{body{max-width:515pt;margin:30pt auto;padding:12pt}}
</style><body><main id="report"></main><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mean=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0;
const colors=["#ff4146","#ff701f","#efa600","#9a72cf","#258fa1"];
const color=l=>colors[(l-1)%colors.length];
function text(x,y,t,size=9,fill="#999",anchor="start"){return '<text x="'+x+'" y="'+y+'" font-size="'+size+'" fill="'+fill+'" text-anchor="'+anchor+'">'+esc(t)+'</text>';}
function line(x,y,x2,y2,stroke="#ddd",dash=""){return '<path d="M'+x+' '+y+'L'+x2+' '+y2+'" stroke="'+stroke+'" stroke-dasharray="'+dash+'" fill="none"/>';}
function chart(points,criteria={},binary=false,growth=false,events={}){
 const w=660,h=growth?240:166,left=44,right=18,top=25,bottom=28,pw=w-left-right,ph=h-top-bottom;
 const dates=[...new Set(points.map(p=>p.date))].sort();
 const x=d=>left+(dates.length<=1?pw/2:dates.indexOf(d)*pw/(dates.length-1)),y=v=>top+ph*(1-v/100);
 let out='<svg class="chart" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="기록일별 정반응률 그래프">';
 for(let v=0;v<=100;v+=20)out+=line(left,y(v),w-right,y(v),"#e4e4e4")+text(left-7,y(v)+3,v+(growth?"%":""),8,"#aaa","end");
 const common=[...new Set(Object.values(criteria))];
 if(growth||common.length===1){const c=growth?80:common[0];out+=line(left,y(c),w-right,y(c),"#649b21","4 3")+text(w-right,y(c)-6,"숙달 "+c+"%",9,"#649b21","end");}
 const groups=points.reduce((a,p)=>{(a[p.level]??=[]).push(p);return a},{});
 for(const [level,s] of Object.entries(groups)){
   const ink=growth?"#ff91b1":color(+level),path=s.map((p,i)=>(i?"L":"M")+x(p.date)+" "+y(p.value)).join(" ");
   if(growth&&s.length>1)out+='<path d="'+path+' L'+x(s.at(-1).date)+' '+y(0)+' L'+x(s[0].date)+' '+y(0)+'Z" fill="#fff7fa"/>';
   if(!binary)out+='<path d="'+path+'" fill="none" stroke="'+ink+'" stroke-width="2"/>';
   if(!growth&&s.length){const first=x(s[0].date);out+=text(first+2,14,"L"+level,9,"#777");if(+level>1)out+=line(first,18,first,y(0),"#ccc","3 3");
    if(common.length>1){const c=criteria[level]??80;out+=line(first,y(c),x(s.at(-1).date),y(c),"#649b21","4 3")+text(first+3,y(c)-5,c+"%",8,"#649b21");}
   }
   s.forEach((p,i)=>{
    const partial=!growth&&p.applicableCount>0&&p.recordedCount<p.applicableCount;
    out+=binary?text(x(p.date),y(p.value)+4,p.value===100?"O":p.value===0?"X":"?",12,ink,"middle"):
      '<circle cx="'+x(p.date)+'" cy="'+y(p.value)+'" r="'+(growth?4:partial?3.6:2.8)+'" fill="'+(growth||partial?"white":ink)+'" stroke="'+(growth||partial?ink:"white")+'" stroke-width="'+(partial?1.5:1)+'"/>';
    if(growth&&i%Math.max(1,Math.ceil(s.length/14))===0)out+=text(x(p.date),y(p.value)-10,Math.round(p.value)+"%",9,"#e9658c","middle");
    if(growth&&events[p.date])out+=text(x(p.date),y(p.value)+15,events[p.date],7,"#999","middle");
   });
 }
 const step=Math.max(1,Math.ceil(dates.length/9));
 dates.forEach((date,i)=>{if(i%step===0||i===dates.length-1)out+=text(x(date),h-8,date.slice(5).replace("-","."),8,"#999","middle")});
 return out+"</svg>";
}
function ageAt(birth, end){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(birth||'')||!/^\d{4}-\d{2}-\d{2}$/.test(end||'')||birth>end)return '미입력';
 const [by,bm,bd]=birth.split('-').map(Number),[ey,em,ed]=end.split('-').map(Number);
 const months=(ey-by)*12+em-bm-(ed<bd?1:0);
 return months<0?'미입력':Math.floor(months/12)+'세 '+months%12+'개월';
}
function narrative(title,body){
 return '<div class="narrative-block"><h3>'+esc(title)+'</h3><div class="body">'+esc(String(body??'').trim()||'미작성')+'</div></div>';
}
function renderReport(doc){
 const d=doc.draft;
 const value=v=>esc(String(v??'').trim()||'미입력');
 const days=new Set(doc.goals.flatMap(g=>g.points.map(p=>p.date))).size;
 const logo=/^[A-Za-z0-9+/=]+$/.test(d.logoPNG||'')?'<img class="logo" alt="기관 로고" src="data:image/png;base64,'+d.logoPNG+'">':'';
 let html='<header>'+logo+'<strong>'+value(d.institution)+'</strong> | '+value(doc.childName)+' 학생 ('+value(doc.birthDate)+', '+ageAt(doc.birthDate,doc.end)+')<h1>수행 보고서</h1>';
 html+='<p>기간: '+esc(doc.start)+' ~ '+esc(doc.end)+'<br>주당 빈도: '+value(d.schedule)+' · 세션 시간: '+value(d.duration)+' · 총 회기: '+value(d.totalSessions)+'<br>작성자: '+value(d.therapist)+'</p>';
 html+='<p class="hint">생활연령은 보고 기간 종료일 기준입니다. 유효한 완료 기록이 있는 치료일: '+days+'일. 과제별 기록 수는 실제 방문 회기 수와 다르므로 총 회기는 작성자가 확인하여 입력합니다.</p></header>';
 html+='<section class="report-section"><h2>1. 개요</h2>'+narrative('치료 목적 · 사용 프로그램 · 현재 수행 · 중재 및 교수 전략',d.currentStatus)+'</section>';
 html+='<section class="report-section"><h2>2. 진행 과제 및 수행 기록</h2><p class="hint">NA와 미완료 기록은 제외합니다. 날짜별 적용 과제 정반응률의 평균이며 실제 기록일을 등간격으로 표시합니다. 빈 원은 일부 과제만 기록된 날입니다. 레벨 전환에서는 선을 연결하지 않습니다.</p>';
 const ordered=[...doc.goals].sort((a,b)=>a.domain.localeCompare(b.domain,'ko')||a.name.localeCompare(b.name,'ko'));
 for(const g of ordered){
  const levels=[...new Set(g.points.map(p=>p.level))].sort((a,b)=>a-b);
  let tasks='';
  for(const l of levels){
   const entries=String(g.learning[String(l)]||'').split('\n').filter(Boolean);
   tasks+='<div class="task-level"><strong>L'+l+'</strong><ul>'+entries.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></div>';
  }
  html+='<article class="performance-record" data-goal-id="'+esc(g.id)+'"><h3 class="program-title">'+esc(g.name)+'</h3><table class="task-table"><tbody><tr><th>영역</th><td>'+esc(g.domain)+'</td></tr><tr><th>목표</th><td>'+esc(g.objective||g.name)+'</td></tr><tr><th>진행 과제 (List)</th><td>'+tasks+'</td></tr></tbody></table><div class="graph-box">'+chart(g.points,g.criteria,g.binary)+'</div>'+narrative('세션 노트 및 가정 연계 사항',d.notesByProgram?.[g.id])+'</article>';
 }
 if(!ordered.length)html+='<p>선택 기간에 유효한 완료 기록이 없습니다.</p>';
 if(String(d.homePractice||'').trim())html+=narrative('공통 가정 연계 사항',d.homePractice);
 html+='</section><section class="report-section"><h2>3. 결과 해석</h2>';
 for(const [title,body] of [['① 향상된 부분',d.majorChanges],['② 아직 지원이 필요한 부분',d.supportNeeds],['③ 행동 변화',d.behavior],['④ 전체적인 해석',d.therapistOpinion]])html+=narrative(title,body);
 html+='</section><section class="report-section"><h2>4. 향후 목표 및 치료 계획</h2>'+narrative('유지·일반화 목표 · 신규 목표 · 다음 중재 방향',d.nextGoals)+'</section>';
 document.getElementById('report').innerHTML=html;
 return {sections:4,stoCount:doc.goals.reduce((n,g)=>n+new Set(g.points.map(p=>p.level)).size,0),masteredCount:doc.goals.reduce((n,g)=>n+g.masteredLevels.length,0)};
}
</script></body></html>
