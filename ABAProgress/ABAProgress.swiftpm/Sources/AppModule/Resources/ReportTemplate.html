<!doctype html><html lang="ko"><meta charset="utf-8">
<style>
:root{--pink:#e9658c;--line:#f4c6d4;color-scheme:light}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{margin:0;color:#252525;background:white;font:10pt -apple-system,"Apple SD Gothic Neo",sans-serif;line-height:1.85}
.page{break-before:page;page-break-before:always}.page:first-child{break-before:auto;page-break-before:auto}
h1{font-size:26pt;letter-spacing:2pt;margin:12pt 0}h2{font-size:13pt;margin:12pt 0 7pt;border-bottom:1pt solid var(--pink);padding-bottom:5pt}h3{font-size:11pt;margin:0}
p{margin:0 0 16pt;white-space:pre-wrap;overflow-wrap:anywhere}.hint,.muted{color:#898989;font-size:8pt}
.cover{text-align:center;padding-top:5pt}.cover-meta{text-align:left;color:#aaa;font-size:7pt}
.brand{color:var(--pink);font-size:15pt;letter-spacing:1pt;margin:22pt 0 0}.brandmark{color:var(--pink);font-weight:800;font-size:23pt;letter-spacing:-1pt;margin-top:28pt}
.cover table{margin-top:22pt;text-align:left;width:100%;border-collapse:collapse;font-size:10pt}td,th{border:.6pt solid var(--line);padding:9pt 12pt}th{background:#fff1f5;color:var(--pink);font-weight:600;width:16%}
.summary{margin-top:12pt;padding:10pt 13pt;background:#fffafb;border:.6pt solid var(--line);border-left:3pt solid var(--pink);border-radius:5pt;text-align:left}.summary small{color:var(--pink);font-size:7pt;letter-spacing:1pt}.summary p{margin:3pt 0}
.chart{width:100%;display:block}.goal{border:.6pt solid #ddd;border-left:3pt solid #e6d9f2;border-radius:9pt;padding:10pt 12pt;margin:10pt 0;break-inside:avoid;page-break-inside:avoid}
.group{color:#a67ac3;border-left:3pt solid #ff91b1;padding-left:8pt;font-size:10pt;margin-top:10pt}.goal-title{display:flex;justify-content:space-between;gap:12pt;align-items:start}
.status{white-space:nowrap;color:white;border-radius:12pt;padding:1pt 8pt;background:#368de2;font-size:7pt}.status.done{background:#619d20}.domain{font-size:8pt;color:#999;margin:4pt 0 8pt}
.graph-box,.learning{background:#f9f9f9;border-radius:7pt;padding:8pt 10pt;margin-top:7pt}.learning{font-size:8pt;color:#666;border-left:2pt solid #e6d9f2}.learning p{margin:3pt 0}
.level{border:1pt solid currentColor;border-radius:6pt;padding:0 5pt;display:inline-block;margin-right:6pt;font-size:7pt}
.narrative h2{font-size:10pt;color:var(--pink);border-top:.6pt solid var(--line);border-bottom:0;padding-top:8pt;font-weight:500}
.narrative .body{background:#fdfbfc;border-left:2pt solid #ff91b1;padding:10pt 13pt;min-height:120pt;white-space:pre-wrap;overflow-wrap:anywhere}
.signature{padding-top:425pt;text-align:center}.signature table{width:76%;margin:10pt auto;border-collapse:collapse;font-size:9pt}.signature th{background:white}
.signature .note{font-size:8pt;color:#aaa;line-height:1.5}.closing{color:var(--pink);border:.6pt solid var(--pink);border-radius:7pt;margin-top:18pt;padding:12pt;font-size:9pt}
@media screen{body{max-width:515pt;margin:35pt auto}.page{border-bottom:1px dashed #ddd;min-height:730pt;margin-bottom:30pt}}
</style><body><main id="report"></main><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mean=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0;
const colors=["#ff4146","#ff701f","#efa600","#9a72cf","#258fa1"];
const color=l=>colors[(l-1)%colors.length];
function text(x,y,t,size=9,fill="#999",anchor="start"){return '<text x="'+x+'" y="'+y+'" font-size="'+size+'" fill="'+fill+'" text-anchor="'+anchor+'">'+esc(t)+'</text>';}
function line(x,y,x2,y2,stroke="#ddd",dash=""){return '<path d="M'+x+' '+y+'L'+x2+' '+y2+'" stroke="'+stroke+'" stroke-dasharray="'+dash+'" fill="none"/>';}
function chart(points,criteria={},binary=false,growth=false,events={}){
 const w=660,h=growth?240:166,left=44,right=18,top=25,bottom=28,pw=w-left-right,ph=h-top-bottom;
 const dates=[...new Set(points.map(p=>p.date))].sort();
 const x=d=>left+(dates.length<=1?pw/2:dates.indexOf(d)*pw/(dates.length-1)),y=v=>top+ph*(1-v/100);
 let out='<svg class="chart" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="기록일별 정반응률 그래프">';
 for(let v=0;v<=100;v+=20)out+=line(left,y(v),w-right,y(v),"#e4e4e4")+text(left-7,y(v)+3,v+(growth?"%":""),8,"#aaa","end");
 const common=[...new Set(Object.values(criteria))];
 if(growth||common.length===1){const c=growth?80:common[0];out+=line(left,y(c),w-right,y(c),"#649b21","4 3")+text(w-right,y(c)-6,"숙달 "+c+"%",9,"#649b21","end");}
 const groups=points.reduce((a,p)=>{(a[p.level]??=[]).push(p);return a},{});
 for(const [level,s] of Object.entries(groups)){
   const ink=growth?"#ff91b1":color(+level),path=s.map((p,i)=>(i?"L":"M")+x(p.date)+" "+y(p.value)).join(" ");
   if(growth&&s.length>1)out+='<path d="'+path+' L'+x(s.at(-1).date)+' '+y(0)+' L'+x(s[0].date)+' '+y(0)+'Z" fill="#fff7fa"/>';
   if(!binary)out+='<path d="'+path+'" fill="none" stroke="'+ink+'" stroke-width="2"/>';
   if(!growth&&s.length){const first=x(s[0].date);out+=text(first+2,14,"L"+level,9,"#777");if(+level>1)out+=line(first,18,first,y(0),"#ccc","3 3");
    if(common.length>1){const c=criteria[level]??80;out+=line(first,y(c),x(s.at(-1).date),y(c),"#649b21","4 3")+text(first+3,y(c)-5,c+"%",8,"#649b21");}
   }
   s.forEach((p,i)=>{
    out+=binary?text(x(p.date),y(p.value)+4,p.value===100?"O":p.value===0?"X":"?",12,ink,"middle"):
      '<circle cx="'+x(p.date)+'" cy="'+y(p.value)+'" r="'+(growth?4:2.8)+'" fill="'+(growth?"white":ink)+'" stroke="'+(growth?ink:"white")+'"/>';
    if(growth&&i%Math.max(1,Math.ceil(s.length/14))===0)out+=text(x(p.date),y(p.value)-10,Math.round(p.value)+"%",9,"#e9658c","middle");
    if(growth&&events[p.date])out+=text(x(p.date),y(p.value)+15,events[p.date],7,"#999","middle");
   });
 }
 const step=Math.max(1,Math.ceil(dates.length/9));
 dates.forEach((date,i)=>{if(i%step===0||i===dates.length-1)out+=text(x(date),h-8,date.slice(5).replace("-","."),8,"#999","middle")});
 return out+"</svg>";
}
function renderReport(doc){
 const d=doc.draft,groups=new Map();
 for(const g of doc.goals){const a=groups.get(g.domain)||[];for(const l of new Set(g.points.map(p=>p.level)))a.push(g.points.filter(p=>p.level===l));groups.set(g.domain,a);}
 const domains=[...groups].map(([name,a])=>({name,count:a.length,first:mean(a.map(s=>mean(s.slice(0,3).map(p=>p.value)))),recent:mean(a.map(s=>mean(s.slice(-3).map(p=>p.value))))})).sort((a,b)=>b.recent-a.recent);
 const total=domains.reduce((s,r)=>s+r.count,0),mastered=doc.goals.reduce((s,g)=>s+g.masteredLevels.length,0);
 const initial=mean(domains.map(r=>r.first)),recent=mean(domains.map(r=>r.recent)),delta=recent-initial;
 let html='<section class="page cover"><div class="cover-meta">보고유형 중간보고서<br>보고기간 '+esc(doc.start)+' ~ '+esc(doc.end)+'</div><div class="brandmark">ABA</div><div class="brand">'+esc(d.institution)+'</div><div class="muted">개별화된 데이터 기반 중재 · 언어/행동 통합적 접근</div><h1>중간 보고서</h1><div class="muted">'+esc(doc.childName)+' 아동 · '+esc(d.therapist)+' 치료사</div><table>';
 const rows=[["아동명",doc.childName,"생년월일",doc.birthDate],["소속반",d.className,"담당 치료사",d.therapist],["치료기간",doc.start+" ~ "+doc.end,"프로그램",d.programFamily],["주 횟수",d.schedule,"회기 시간",d.duration]];
 for(const r of rows)html+="<tr><th>"+esc(r[0])+"</th><td>"+esc(r[1])+"</td><th>"+esc(r[2])+"</th><td>"+esc(r[3])+"</td></tr>";
 html+='</table><div class="summary"><small>SUMMARY · 핵심 요약</small><p>'+esc(doc.childName)+' 아동의 영역별 달성률 평균은 '+Math.round(initial)+'%에서 '+Math.round(recent)+'%로 '+(delta>=0?"+":"")+Math.round(delta)+'%p 변화했습니다. '+total+'개 STO 중 '+mastered+'개에서 보고 기간 내 준거를 달성했습니다.</p></div></section>';
 let bars='<svg class="chart" viewBox="0 0 660 '+Math.max(100,domains.length*30+30)+'" xmlns="http://www.w3.org/2000/svg">'+text(390,15,"평균 달성률(%)",10,"#777","middle");
 domains.forEach((r,i)=>{const y=30+i*30;bars+=text(212,y+13,r.name+" ("+r.count+"개)",11,"#555","end")+
 '<rect x="224" y="'+y+'" width="390" height="18" rx="4" fill="#f4f4f4"/><rect x="224" y="'+y+'" width="'+r.recent*3.9+'" height="18" rx="4" fill="'+(r.recent>=80?"#619d20":r.recent>=60?"#4c96dd":"#f3ad37")+'"/>'+text(Math.min(626,230+r.recent*3.9),y+13,Math.round(r.recent)+"%",11,"#333");});
 const dates=[...new Set(doc.goals.flatMap(g=>g.points.map(p=>p.date)))].sort();
 const growth=dates.map(date=>({date,level:0,value:mean(doc.goals.map(g=>g.points.filter(p=>p.date<=date).at(-1)?.value).filter(v=>v!==undefined))}));
 const events={};for(const g of doc.goals){const levels=[...new Set(g.points.map(p=>p.level))];for(const l of levels){const date=g.points.find(p=>p.level===l)?.date;if(date)events[date]=l===levels[0]?"+새 목표":"+새 단계";}}
 html+='<section class="page"><h2>영역별 균형 분석</h2><p class="hint">※ 영역별 최근 3회기 평균 달성률 · 괄호는 단기 목표(STO) 수 · 회색은 달성률로 나타내지 않는 영역<br>※ 초록 80% 이상 숙달 · 파랑 60~79% 진전 · 주황 60% 미만 집중 지도</p>'+bars+'</svg><div style="height:25pt"></div><h2>성장 추이 (전체 목표 평균)</h2><p class="hint">※ 선택 기간에 관측된 전체 목표의 평균 정반응률 · 그날 측정하지 않은 목표는 최근 값 사용 · 라벨은 일부만 표시<br>※ +새 목표 / +새 단계는 새로 시작한 날 — 낮은 수행률에서 출발해 평균이 잠시 내려갈 수 있습니다</p>'+chart(growth,{},false,true,events)+'</section>';
 const ordered=[...doc.goals].sort((a,b)=>a.group.localeCompare(b.group,"ko")||a.domain.localeCompare(b.domain,"ko")||a.name.localeCompare(b.name,"ko"));
 for(let i=0;i<ordered.length;i+=2){
  html+='<section class="page">'+(i===0?'<h2>영역별 세부 학습 목표</h2><p class="hint">※ 영역별 목표의 진행 상태와 추이선 · 회기당 1회 시도 목표는 O(성공)·X(실패)로 표시</p>':"");
  let last="";
  for(const g of ordered.slice(i,i+2)){
   if(last!==g.group){html+='<div class="group">'+esc(g.group)+'</div>';last=g.group;}
   const levels=[...new Set(g.points.map(p=>p.level))],done=levels.length>0&&levels.every(l=>g.masteredLevels.includes(l));
   html+='<article class="goal"><div class="goal-title"><h3>'+esc(g.name)+'</h3><span class="status '+(done?"done":"")+'">'+(done?"완료":"진행중")+'</span></div><div class="domain">'+esc(g.domain)+'</div><div class="graph-box">'+chart(g.points,g.criteria,g.binary)+'</div><div class="learning">학습 내용';
   for(const l of levels)html+='<p><span class="level" style="color:'+color(l)+'">L'+l+'</span>'+esc(g.learning[String(l)]||"")+'</p>';
   html+="</div></article>";
  }html+="</section>";
 }
 for(const [title,body] of [["도전적 행동 변화",d.behavior],["종합 현황",d.currentStatus],["이번 기간의 강점과 주요 변화",d.majorChanges],["치료사 종합 소견",d.therapistOpinion],["가정에서 함께 하기",d.homePractice],["다음 목표",d.nextGoals]])
 html+='<section class="page narrative"><h2>'+esc(title)+'</h2><div class="body">'+esc(body||" ")+'</div></section>';
 html+='<section class="page signature"><div style="color:var(--pink)">확인 및 서명</div><table><tr><th>구 분</th><th>성 명</th><th>서 명</th><th>일 자</th></tr><tr><td>담당 치료사</td><td>'+esc(d.therapist)+'</td><td>(인)</td><td>'+esc(d.signedDate)+'</td></tr><tr><td>기관장</td><td>'+esc(d.director)+'<br><small>'+esc(d.directorCredential)+'</small></td><td>(인)</td><td>'+esc(d.signedDate)+'</td></tr></table><div class="note">본 보고서는 '+esc(doc.childName)+' 아동의 IEP에 따라 작성되었으며, 데이터 기반 분석을 통해 아동의 강점 영역과 진행 양상을 정리하였습니다.<br>'+esc(d.institution)+'는 아동의 다음 단계 학습을 위한 체계적 중재를 진행합니다.</div><div class="closing">본 보고 기간 동안 확인된 진행 양상을 토대로, 다음 단계의 중재를 진행합니다.</div></section>';
 document.getElementById("report").innerHTML=html;
 return {sections:document.querySelectorAll(".page").length,stoCount:total,masteredCount:mastered};
}
</script></body></html>
